services:
  - type: web
    name: thermashield-360
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: live
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: CARTO_API_KEY
        sync: false
      - key: VITE_CARTO_API_KEY
        sync: false
      - key: COPERNICUS_CDS_URL
        value: https://cds.climate.copernicus.eu/api
      - key: COPERNICUS_CDS_API_KEY
        sync: false
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: NASA_FIRMS_BASE_URL
        value: https://firms.modaps.eosdis.nasa.gov/api
      - key: OPENAQ_API_KEY
        sync: false
      - key: OPENAQ_BASE_URL
        value: https://api.openaq.org/v3
      - key: NOAA_NCEI_TOKEN
        sync: false
      - key: NOAA_USER_AGENT
        value: ThermaShield360/1.0 (contact@thermashield.org)
      - key: ECMWF_OPEN_DATA_BASE_URL
        value: https://data.ecmwf.int/forecasts
      - key: NASA_POWER_BASE_URL
        value: https://power.larc.nasa.gov/api
      - key: VITE_OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1
